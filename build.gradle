plugins {
    id 'fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Nur zum Kompilieren: minimale Kopie der Mod-Menu-API (zwei Interfaces).
// Wird NICHT ins Jar gepackt – ist Mod Menu installiert, liefert es die echten Klassen.
sourceSets {
    stubs {
        java {
            srcDir 'src/stubs/java'
        }
        compileClasspath += configurations.compileClasspath
    }
    main {
        compileClasspath += sourceSets.stubs.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
    it.options.compilerArgs << "-Xlint:deprecation"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Automatisierter In-Game-Test: ./gradlew runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "inspectall-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
