name: Release

# Wird eine Versionsnummer wie v1.0.0 hochgeladen, baut GitHub die Mod,
# veröffentlicht ein GitHub-Release und lädt dieselbe .jar auf Modrinth hoch.
# Text für beide: .github/release-notes.md
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen und testen
        run: ./gradlew build
      - name: GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: InspectAll ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: build/libs/inspectall-*.jar
      - name: Auf Modrinth hochladen
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: FmCwRnux
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/inspectall-*.jar
          name: InspectAll ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: .github/release-notes.md
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          dependencies: |
            fabric-api(required)
            modmenu(optional)
